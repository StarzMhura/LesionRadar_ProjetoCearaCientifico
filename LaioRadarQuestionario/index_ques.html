<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionário Esportivo</title>
    
    <link rel="stylesheet" href="style_ques.css">
</head>
<body>

    <div class="container">
        
        <h2>Questionário</h2>
        <p class="subtitulo">Por favor, responda às perguntas abaixo para traçarmos seu perfil</p>
        
        <form id="formEsportivo">
            
            <h3>Dados Pessoais</h3>
            <table>
                <tr>
                    <td style="width: 60%;">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" placeholder="Seu primeiro e segundo nome" required>
                    </td>
                    <td style="width: 40%;">
                        <label for="idade">Idade</label>
                        <input type="number" id="idade" placeholder="Sua idade" required>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="peso">Peso (kg)</label>
                        <input type="number" id="peso" step="0.1" placeholder="Seu peso" required>
                    </td>
                    <td>
                        <label for="altura">Altura (m)</label>
                        <input type="number" id="altura" step="0.01" placeholder="Sua altura" required>
                    </td>
                </tr>
            </table>

            <hr>

            <div class="pergunta">
                <label for="esporte">Qual esporte/atividade física você pratica?</label>
                <input type="text" id="esporte">
            </div>

            <div class="pergunta">
                <label for="frequencia">Quantas vezes na semana você pratica?</label>
                <input type="number" id="frequencia" min="0" max="7" 
            </div>

              <div class="campo">
                <label for="objetivo">Qual é seu principal objetivo?</label>
                <select id="objetivo" required>
                <option value="" disabled selected>Selecione...</option>
                <option value="emagrecer">Emagrecimento / Perda de gordura</option>
                <option value="hipertrofia">Ganho de massa muscular (Hipertrofia)</option>
                <option value="condicionamento">Melhorar condicionamento físico</option>
                <option value="forca">Ganho de força</option>
                <option value="saude">Saúde geral e bem-estar</option>
                <option value="flexibilidade">Flexibilidade e mobilidade</option>
                </select>
              </div>

            <div class="pergunta">
                <label>Você recebe algum tipo de orientação profissional?</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="orientacao" value="sim" required> Sim
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="orientacao" value="nao"> Não
                    </label>
                </div>
            </div>

            <div class="pergunta">
                <label>Já sofreu algum tipo de lesão com essa prática?</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="lesao" value="sim" required> Sim
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="lesao" value="nao"> Não
                    </label>
                </div>
            </div>

            <div class="pergunta">
                <label for="local-lesao">Se sim, em qual local foi sua lesão?</label>
                <input type="text" id="local-lesao" placeholder="Ex: Joelho direito, ombro">
            </div>

            <button type="submit" id="btnEnviar">Criar fichas</button>
            <button type="button" id="btn_Voltar" class="botao-voltar" onclick="window.location.href='../index.html'">Voltar para o início
   
</button>

        </form>
    </div>

    <script src="script_ques.js"></script>
</body>
</html>
